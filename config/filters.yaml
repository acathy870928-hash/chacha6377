# 제목에 아래 패턴이 있으면 홍보성 가중치를 추가로 부여합니다. (정규식)
promo_title_patterns:
  - '.{2,10}(생명|화재|손보|손해보험|해상)\s*,\s*.*(출시|선봬|선보|판매|이벤트|증정|후원|수상|오픈)'
  - '\[?(신상품|이벤트|프로모션|기획)\]?'
  - '(무료|공짜|최대)\s*\d+(만원|%)'

# 제목/본문에 있으면 무조건 검수 대기로 올리는 강제 통과 키워드
force_review_keywords:
  - 입법예고
  - 규정변경예고
  - 보험업법 시행령
  - 보험업감독규정
  - 표준약관 개정
  - 감독업무 시행세칙
  - 제도 시행

# 아예 수집 대상에서 버릴 기사 (스팸/시황/부고)
drop_keywords:
  - 부고
  - 인사동정
  - 주가 전망
  - 오늘의 운세
  - 특징주
  - 코스피 마감
