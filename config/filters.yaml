# 자동 분류 규칙
#
# 수집된 기사는 아래 규칙으로 policy_score(제도성) / promo_score(홍보성) 를 계산해
# 세 갈래로 나뉩니다. 최종 판단은 항상 담당자가 합니다.
#
#   review   - 검수 대기 (담당자가 승인/반려)
#   promo    - 상품·홍보로 자동 제외 (담당자가 복원 가능)
#   lowrel   - 제도 관련성 낮음으로 자동 제외 (담당자가 복원 가능)

thresholds:
  # policy_score 가 이 값 이상이어야 제도 뉴스 후보로 봅니다.
  policy_min: 3.0
  # promo_score 가 이 값 이상이면 홍보성으로 간주합니다.
  promo_min: 3.0
  # 홍보성이더라도 제도 점수가 이만큼 앞서면 살립니다.
  # (예: "○○사, 5세대 실손 전환 상품 출시" 처럼 제도 변경이 본문인 경우)
  policy_override_margin: 3.0

