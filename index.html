<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>투두리스트</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1f2328;
    --muted: #6b7280;
    --border: #e3e5e8;
    --accent: #4f46e5;
    --accent-soft: #eef2ff;
    --danger: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d;
      --card: #1e2126;
      --text: #e6e8eb;
      --muted: #9aa1ab;
      --border: #2e323a;
      --accent: #818cf8;
      --accent-soft: #262a35;
      --danger: #f87171;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 40px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Malgun Gothic", "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }

  .app {
    max-width: 560px;
    margin: 0 auto;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
  }

  h1 {
    margin: 0 0 4px;
    font-size: 1.5rem;
  }

  .subtitle {
    margin: 0 0 22px;
    color: var(--muted);
    font-size: 0.875rem;
  }

  form {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
  }

  input[type="text"] {
    flex: 1;
    min-width: 0;
    padding: 11px 13px;
    font-size: 0.95rem;
    font-family: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
  }

  input[type="text"]:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }

  button {
    font-family: inherit;
    font-size: 0.9rem;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid transparent;
  }

  .add-btn {
    padding: 11px 18px;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    white-space: nowrap;
  }

  .filters {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
  }

  .filter-btn {
    padding: 6px 13px;
    background: transparent;
    border-color: var(--border);
    color: var(--muted);
  }

  .filter-btn[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }

  ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  li {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 11px 4px;
    border-bottom: 1px solid var(--border);
  }

  li:last-child { border-bottom: none; }

  input[type="checkbox"] {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .title {
    flex: 1;
    min-width: 0;
    word-break: break-word;
    cursor: text;
  }

  li.done .title {
    text-decoration: line-through;
    color: var(--muted);
  }

  .edit-input {
    flex: 1;
    min-width: 0;
    padding: 5px 8px;
    font-size: 0.95rem;
    font-family: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--accent);
    border-radius: 6px;
  }

  .delete-btn {
    padding: 4px 9px;
    background: transparent;
    color: var(--muted);
    font-size: 1.1rem;
    line-height: 1;
    flex-shrink: 0;
  }

  .delete-btn:hover { color: var(--danger); }

  .empty {
    padding: 34px 0;
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
  }

  footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.85rem;
  }

  .clear-btn {
    padding: 5px 11px;
    background: transparent;
    border-color: var(--border);
    color: var(--muted);
  }

  .clear-btn:hover:not(:disabled) {
    color: var(--danger);
    border-color: var(--danger);
  }

  .clear-btn:disabled {
    opacity: 0.4;
    cursor: default;
  }
</style>
</head>
<body>
  <main class="app">
    <h1>투두리스트</h1>
    <p class="subtitle">할 일은 브라우저에 자동으로 저장됩니다.</p>

    <form id="add-form">
      <input type="text" id="new-todo" placeholder="할 일을 입력하세요" autocomplete="off" maxlength="200">
      <button type="submit" class="add-btn">추가</button>
    </form>

    <div class="filters" id="filters">
      <button type="button" class="filter-btn" data-filter="all">전체</button>
      <button type="button" class="filter-btn" data-filter="active">진행 중</button>
      <button type="button" class="filter-btn" data-filter="done">완료</button>
    </div>

    <ul id="list"></ul>
    <p class="empty" id="empty" hidden></p>

    <footer>
      <span id="count"></span>
      <button type="button" class="clear-btn" id="clear-done">완료 항목 삭제</button>
    </footer>
  </main>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'todos.v1';

  var form = document.getElementById('add-form');
  var input = document.getElementById('new-todo');
  var list = document.getElementById('list');
  var empty = document.getElementById('empty');
  var count = document.getElementById('count');
  var clearBtn = document.getElementById('clear-done');
  var filters = document.getElementById('filters');

  var todos = load();
  var filter = 'all';
  var editingId = null;

  function load() {
    try {
      var raw = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (!Array.isArray(raw)) return [];
      return raw
        .filter(function (t) { return t && typeof t.title === 'string'; })
        .map(function (t) {
          return { id: String(t.id || nextId()), title: t.title, done: !!t.done };
        });
    } catch (e) {
      return [];
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    } catch (e) {
      /* 저장 공간이 없거나 접근이 막힌 경우에도 화면 동작은 유지한다 */
    }
  }

  function nextId() {
    return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
  }

  function visible() {
    if (filter === 'active') return todos.filter(function (t) { return !t.done; });
    if (filter === 'done') return todos.filter(function (t) { return t.done; });
    return todos;
  }

  var EMPTY_TEXT = {
    all: '아직 할 일이 없습니다. 위에서 추가해 보세요.',
    active: '진행 중인 할 일이 없습니다.',
    done: '완료한 할 일이 없습니다.'
  };

  function render() {
    var items = visible();
    list.textContent = '';

    items.forEach(function (todo) {
      list.appendChild(todo.id === editingId ? editRow(todo) : row(todo));
    });

    empty.hidden = items.length > 0;
    empty.textContent = EMPTY_TEXT[filter];

    var left = todos.filter(function (t) { return !t.done; }).length;
    var doneCount = todos.length - left;
    count.textContent = todos.length === 0
      ? '할 일 0개'
      : '전체 ' + todos.length + '개 · 진행 중 ' + left + '개 · 완료 ' + doneCount + '개';
    clearBtn.disabled = doneCount === 0;

    Array.prototype.forEach.call(filters.children, function (btn) {
      btn.setAttribute('aria-pressed', String(btn.dataset.filter === filter));
    });
  }

  function row(todo) {
    var li = document.createElement('li');
    li.dataset.id = todo.id;
    if (todo.done) li.className = 'done';

    var check = document.createElement('input');
    check.type = 'checkbox';
    check.checked = todo.done;
    check.setAttribute('aria-label', todo.title + ' 완료 표시');
    check.addEventListener('change', function () {
      todo.done = check.checked;
      save();
      render();
    });

    var title = document.createElement('span');
    title.className = 'title';
    title.textContent = todo.title;
    title.title = '더블클릭하면 수정할 수 있습니다';
    title.addEventListener('dblclick', function () {
      editingId = todo.id;
      render();
    });

    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'delete-btn';
    del.textContent = '×';
    del.setAttribute('aria-label', todo.title + ' 삭제');
    del.addEventListener('click', function () {
      todos = todos.filter(function (t) { return t.id !== todo.id; });
      save();
      render();
    });

    li.append(check, title, del);
    return li;
  }

  function editRow(todo) {
    var li = document.createElement('li');
    li.dataset.id = todo.id;

    var field = document.createElement('input');
    field.type = 'text';
    field.className = 'edit-input';
    field.value = todo.title;
    field.maxLength = 200;

    function commit() {
      var value = field.value.trim();
      if (value) todo.title = value;
      editingId = null;
      save();
      render();
    }

    field.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        commit();
      } else if (e.key === 'Escape') {
        editingId = null;
        render();
      }
    });
    field.addEventListener('blur', commit);

    li.appendChild(field);
    // 행이 DOM에 붙은 뒤 포커스를 줘야 커서가 정상적으로 들어간다
    setTimeout(function () {
      field.focus();
      field.setSelectionRange(field.value.length, field.value.length);
    }, 0);
    return li;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var value = input.value.trim();
    if (!value) return;
    todos.push({ id: nextId(), title: value, done: false });
    input.value = '';
    input.focus();
    save();
    render();
  });

  filters.addEventListener('click', function (e) {
    var btn = e.target.closest('.filter-btn');
    if (!btn) return;
    filter = btn.dataset.filter;
    editingId = null;
    render();
  });

  clearBtn.addEventListener('click', function () {
    todos = todos.filter(function (t) { return !t.done; });
    save();
    render();
  });

  render();
})();
</script>
</body>
</html>
