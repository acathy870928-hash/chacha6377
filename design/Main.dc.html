<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap">
  <style>
    body{margin:0;font-family:"IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;word-break:keep-all;}
    a{color:#0E6E70;} a:hover{color:#0A5557;}
  </style>
</helmet>

<div style="width:390px;height:844px;background:#F5F6F4;color:#1B2A2E;display:flex;flex-direction:column;overflow:hidden">

  <div style="flex-grow:1;display:flex;flex-direction:column;gap:0;padding:60px 24px 0">

    <div style="display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:15px;font-weight:600;letter-spacing:-0.01em">insurance AI</span>
      <div style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;margin-right:-10px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6E7C7E" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20c0-3.6 3.1-5.5 7-5.5s7 1.9 7 5.5"></path></svg>
      </div>
    </div>

    <div style="height:44px"></div>

    <h1 style="margin:0;font-family:'Gowun Batang',serif;font-weight:700;font-size:27px;line-height:1.45;letter-spacing:-0.025em">
      보험에 대해<br>무엇이든 물어보세요
    </h1>
    <p style="margin:14px 0 0;font-size:14px;line-height:1.7;color:#6E7C7E">
      약관을 근거로 정확하게 답합니다.<br>모르면 모른다고 말씀드립니다.
    </p>

    <div style="height:28px"></div>

    <div style="display:flex;align-items:center;gap:10px;background:#FFFFFF;border:1px solid #C9D2CC;border-radius:14px;padding:6px 6px 6px 18px">
      <span style="flex-grow:1;font-size:15px;color:#9AA5A4">궁금한 것을 물어보세요</span>
      <div style="width:46px;height:46px;flex-shrink:0;border-radius:10px;background:#1B2A2E;display:flex;align-items:center;justify-content:center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F5F6F4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13"></path><path d="M12.5 6l6 6-6 6"></path></svg>
      </div>
    </div>

    <div style="height:26px"></div>

    <p style="margin:0 0 10px;font-size:11px;letter-spacing:0.12em;color:#8B9694">이런 걸 물어보셨습니다</p>

    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:center;gap:12px;min-height:52px;background:#FFFFFF;border:1px solid #E2E7E2;border-radius:12px;padding:0 16px">
        <span style="flex-grow:1;font-size:14px;line-height:1.5">이거 보상 되나요?</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B4BDBB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
      </div>
      <div style="display:flex;align-items:center;gap:12px;min-height:52px;background:#FFFFFF;border:1px solid #E2E7E2;border-radius:12px;padding:0 16px">
        <span style="flex-grow:1;font-size:14px;line-height:1.5">이 특약은 무슨 뜻인가요?</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B4BDBB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
      </div>
      <div style="display:flex;align-items:center;gap:12px;min-height:52px;background:#FFFFFF;border:1px solid #E2E7E2;border-radius:12px;padding:0 16px">
        <span style="flex-grow:1;font-size:14px;line-height:1.5">제 보험은 뭐가 부족한가요?</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B4BDBB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
      </div>
    </div>

    <div style="height:24px"></div>

    <div style="display:flex;align-items:center;gap:14px;min-height:64px;background:#E8F1F0;border-radius:12px;padding:14px 16px">
      <div style="width:38px;height:38px;flex-shrink:0;border-radius:9px;background:#FFFFFF;display:flex;align-items:center;justify-content:center">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#0E6E70" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"></path><path d="M14 3v4h4"></path><path d="M9 12h6"></path><path d="M9 16h4"></path></svg>
      </div>
      <div style="flex-grow:1">
        <p style="margin:0;font-size:14px;font-weight:600;line-height:1.4">약관을 넣어주시면 더 정확해집니다</p>
        <p style="margin:3px 0 0;font-size:12px;color:#4C6265;line-height:1.5">가입하신 상품의 보장 범위를 그대로 읽어드립니다</p>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0E6E70" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M9 6l6 6-6 6"></path></svg>
    </div>

  </div>

  <div style="display:flex;border-top:1px solid #DDE2DD;background:#FFFFFF;padding:6px 0 22px">
    <div style="flex-grow:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-height:56px;justify-content:center">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1B2A2E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 15a3 3 0 0 1-3 3H8l-4 3V6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3z"></path></svg>
      <span style="font-size:10px;font-weight:600;color:#1B2A2E">물어보기</span>
    </div>
    <div style="flex-grow:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-height:56px;justify-content:center">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#98A3A1" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9V6z"></path></svg>
      <span style="font-size:10px;color:#98A3A1">내 보험</span>
    </div>
    <div style="flex-grow:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-height:56px;justify-content:center">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#98A3A1" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h10"></path></svg>
      <span style="font-size:10px;color:#98A3A1">더보기</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
