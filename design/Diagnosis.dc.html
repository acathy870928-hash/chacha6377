<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap">
  <style>
    body{margin:0;font-family:"IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;word-break:keep-all;}
    a{color:#0E6E70;} a:hover{color:#0A5557;}
  </style>
</helmet>

<div style="width:390px;height:844px;background:#F5F6F4;color:#1B2A2E;display:flex;flex-direction:column;overflow:hidden">

  <div style="display:flex;align-items:center;gap:4px;padding:56px 16px 12px;border-bottom:1px solid #E2E7E2">
    <div style="width:44px;height:44px;display:flex;align-items:center;justify-content:center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B2A2E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
    </div>
    <span style="font-size:15px;font-weight:600">보장 진단</span>
  </div>

  <div style="flex-grow:1;display:flex;flex-direction:column;padding:20px 20px 0">

    <h1 style="margin:0;font-family:'Gowun Batang',serif;font-weight:700;font-size:21px;line-height:1.55;letter-spacing:-0.025em">
      두 가지 미래를 함께 봤습니다
    </h1>
    <p style="margin:11px 0 0;font-size:13px;line-height:1.7;color:#6E7C7E">
      가입하신 4건의 계약을 약관 기준으로 읽었습니다
    </p>

    <div style="height:20px"></div>

    <div style="background:#FFFFFF;border:1px solid #C9D2CC;border-radius:14px;padding:17px 17px 15px">
      <div style="display:flex;align-items:baseline;gap:9px">
        <span style="font-size:11px;letter-spacing:0.16em;color:#0E6E70;font-weight:600">IF</span>
        <span style="font-size:16px;font-weight:600">만약</span>
        <span style="margin-left:auto;font-size:12px;color:#6E7C7E">질병 · 사고</span>
      </div>
      <div style="height:14px"></div>
      <div style="display:flex;flex-direction:column;gap:0">
        <div style="display:flex;align-items:center;gap:10px;min-height:38px;border-bottom:1px solid #EEF1EE">
          <span style="flex-grow:1;font-size:13px">암</span>
          <span style="font-size:12px;color:#0E6E70;font-weight:600">준비됨</span>
          <div style="display:flex;gap:3px"><div style="width:14px;height:5px;border-radius:3px;background:#0E6E70"></div><div style="width:14px;height:5px;border-radius:3px;background:#0E6E70"></div><div style="width:14px;height:5px;border-radius:3px;background:#0E6E70"></div></div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;min-height:38px;border-bottom:1px solid #EEF1EE">
          <span style="flex-grow:1;font-size:13px">뇌·심장</span>
          <span style="font-size:12px;color:#9A6128;font-weight:600">부족</span>
          <div style="display:flex;gap:3px"><div style="width:14px;height:5px;border-radius:3px;background:#9A6128"></div><div style="width:14px;height:5px;border-radius:3px;background:#E4DCD1"></div><div style="width:14px;height:5px;border-radius:3px;background:#E4DCD1"></div></div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;min-height:38px;border-bottom:1px solid #EEF1EE">
          <span style="flex-grow:1;font-size:13px">입원·수술</span>
          <span style="font-size:12px;color:#0E6E70;font-weight:600">준비됨</span>
          <div style="display:flex;gap:3px"><div style="width:14px;height:5px;border-radius:3px;background:#0E6E70"></div><div style="width:14px;height:5px;border-radius:3px;background:#0E6E70"></div><div style="width:14px;height:5px;border-radius:3px;background:#D5DEDA"></div></div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;min-height:38px">
          <span style="flex-grow:1;font-size:13px">사망·장해</span>
          <span style="font-size:12px;color:#6E7C7E;font-weight:600">겹침</span>
          <div style="display:flex;gap:3px"><div style="width:14px;height:5px;border-radius:3px;background:#98A3A1"></div><div style="width:14px;height:5px;border-radius:3px;background:#98A3A1"></div><div style="width:14px;height:5px;border-radius:3px;background:#98A3A1"></div></div>
        </div>
      </div>
    </div>

    <div style="height:11px"></div>

    <div style="background:#FFFFFF;border:1px solid #C9D2CC;border-radius:14px;padding:17px 17px 15px">
      <div style="display:flex;align-items:baseline;gap:9px">
        <span style="font-size:11px;letter-spacing:0.16em;color:#9A6128;font-weight:600">WHEN</span>
        <span style="font-size:16px;font-weight:600">언젠가</span>
        <span style="margin-left:auto;font-size:12px;color:#6E7C7E">은퇴 · 장수</span>
      </div>
      <div style="height:14px"></div>
      <div style="display:flex;flex-direction:column;gap:0">
        <div style="display:flex;align-items:center;gap:10px;min-height:38px;border-bottom:1px solid #EEF1EE">
          <span style="flex-grow:1;font-size:13px">노후 소득</span>
          <span style="font-size:12px;color:#9A6128;font-weight:600">부족</span>
          <div style="display:flex;gap:3px"><div style="width:14px;height:5px;border-radius:3px;background:#9A6128"></div><div style="width:14px;height:5px;border-radius:3px;background:#E4DCD1"></div><div style="width:14px;height:5px;border-radius:3px;background:#E4DCD1"></div></div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;min-height:38px;border-bottom:1px solid #EEF1EE">
          <span style="flex-grow:1;font-size:13px">연금 수령</span>
          <span style="font-size:12px;color:#98A3A1;font-weight:600">없음</span>
          <div style="display:flex;gap:3px"><div style="width:14px;height:5px;border-radius:3px;background:#E5E9E5"></div><div style="width:14px;height:5px;border-radius:3px;background:#E5E9E5"></div><div style="width:14px;height:5px;border-radius:3px;background:#E5E9E5"></div></div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;min-height:38px">
          <span style="flex-grow:1;font-size:13px">상속 준비</span>
          <span style="font-size:12px;color:#98A3A1;font-weight:600">없음</span>
          <div style="display:flex;gap:3px"><div style="width:14px;height:5px;border-radius:3px;background:#E5E9E5"></div><div style="width:14px;height:5px;border-radius:3px;background:#E5E9E5"></div><div style="width:14px;height:5px;border-radius:3px;background:#E5E9E5"></div></div>
        </div>
      </div>
    </div>

    <div style="height:20px"></div>

    <p style="margin:0 0 10px;font-size:10px;letter-spacing:0.14em;color:#8B9694;font-weight:600">먼저 보실 것</p>
    <div style="display:flex;flex-direction:column;gap:9px">
      <div style="display:flex;gap:11px;align-items:flex-start">
        <span style="font-size:12px;color:#0E6E70;font-weight:600;flex-shrink:0;margin-top:2px">1</span>
        <span style="font-size:13px;line-height:1.65;color:#3E4F52">뇌·심장 진단금이 암 대비 5분의 1 수준입니다</span>
      </div>
      <div style="display:flex;gap:11px;align-items:flex-start">
        <span style="font-size:12px;color:#0E6E70;font-weight:600;flex-shrink:0;margin-top:2px">2</span>
        <span style="font-size:13px;line-height:1.65;color:#3E4F52">사망보장이 3건에 겹쳐 있어 보험료가 새고 있습니다</span>
      </div>
    </div>

  </div>

  <div style="padding:16px 20px 32px">
    <p style="margin:0 0 10px;font-size:11px;color:#8B9694;line-height:1.6;text-align:center">
      이 진단은 지금 계약을 읽은 것입니다. 설계 기준을 세우는 일은 다음 단계입니다.
    </p>
    <div style="min-height:52px;border-radius:13px;border:1px solid #C9D2CC;background:#FFFFFF;display:flex;align-items:center;justify-content:center">
      <span style="font-size:15px;font-weight:500;color:#3E4F52">진단 결과 자세히 보기</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
