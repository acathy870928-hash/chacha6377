# ============================================================
# 연금 세제 규칙 지식베이스
# ============================================================
# ⚠️ 세법은 매년 개정된다. 반드시 매년 1월 세제개편 반영 후 재검수할 것.
# ⚠️ 이 파일의 모든 항목은 준법감시인 검수 후 `compliance_approved: true`로 전환한다.
#
# 최종 갱신: 2026-08-07 / 적용 과세연도: 2026
# ============================================================

meta:
  version: "1.0.0"
  tax_year: 2026
  last_updated: "2026-08-07"
  review_cycle: "연 1회 (매년 1월 세제개편 반영)"
  compliance_approved: false   # ← 준법감시인 검수 후 true로 변경
  owner: "상품기획팀 / 준법감시부"

# ------------------------------------------------------------
# 1. 세제적격 (연금저축 / IRP) — 납입 단계 세액공제
# ------------------------------------------------------------
tax_credit:

  limits:
    - id: TAX-LIM-001
      name: 연금저축_단독_세액공제_한도
      value: 6000000
      unit: KRW_per_year
      description: "연금저축(보험/펀드/신탁) 단독 납입 시 세액공제 대상 한도"
      note: "한도 초과 납입도 가능하나 초과분은 세액공제 대상이 아님"

    - id: TAX-LIM-002
      name: 연금저축_IRP_합산_세액공제_한도
      value: 9000000
      unit: KRW_per_year
      description: "연금저축 + IRP 합산 세액공제 한도"
      note: "⭐ 일반적 최적 배분 = 연금저축 600만 원 + IRP 300만 원"

    - id: TAX-LIM-003
      name: IRP_단독_세액공제_한도
      value: 9000000
      unit: KRW_per_year
      description: "IRP만 가입한 경우 IRP 단독으로 900만 원까지 공제 가능"
      note: "연금저축은 600만 원이 상한이지만 IRP는 900만 원까지 단독 인정"

  rates:
    - id: TAX-RATE-001
      name: 세액공제율_저소득구간
      value: 16.5
      unit: percent
      description: "지방소득세 포함 실효 공제율 (국세 15% + 지방소득세 1.5%)"
      condition:
        총급여_이하: 55000000        # 근로소득자 기준
        종합소득금액_이하: 45000000   # 종합소득자 기준
      max_refund_at_full_limit: 1485000   # 900만 원 × 16.5%
      citation: "(2026년 과세연도 기준)"

    - id: TAX-RATE-002
      name: 세액공제율_고소득구간
      value: 13.2
      unit: percent
      description: "지방소득세 포함 실효 공제율 (국세 12% + 지방소득세 1.2%)"
      condition:
        총급여_초과: 55000000
        종합소득금액_초과: 45000000
      max_refund_at_full_limit: 1188000   # 900만 원 × 13.2%
      citation: "(2026년 과세연도 기준)"

  chatbot_usage:
    key_message: "세액공제는 '수익률'이 아니라 '세금 환급'이다. 확정 수익률로 표현하지 말 것."
    forbidden_framing:
      - "16.5% 확정 수익"          # ❌ 금지 — 수익률 표현
      - "정부가 보장하는 이자"      # ❌ 금지
    allowed_framing:
      - "납입액의 13.2~16.5%를 연말정산에서 세액공제받을 수 있습니다"
      - "실질 부담액이 그만큼 줄어드는 효과가 있습니다"

# ------------------------------------------------------------
# 2. 세제적격 — 수령 단계 과세
# ------------------------------------------------------------
pension_income_tax:

  - id: TAX-PIT-001
    name: 연금소득세_55세이상_69세이하
    value: 5.5
    unit: percent
    age_from: 55
    age_to: 69
    description: "연금 수령 시 원천징수 세율 (지방소득세 포함, 분리과세)"

  - id: TAX-PIT-002
    name: 연금소득세_70세이상_79세이하
    value: 4.4
    unit: percent
    age_from: 70
    age_to: 79

  - id: TAX-PIT-003
    name: 연금소득세_80세이상
    value: 3.3
    unit: percent
    age_from: 80
    age_to: 999

  notes:
    - "연금 수령 요건: 만 55세 이후 + 가입기간 5년 이상 + 연금수령한도 내 수령"
    - "종신형 연금은 별도 세율이 적용될 수 있음 → 상품별 확인 필요"
    - "사적연금 소득이 일정 금액을 초과하면 종합과세 또는 분리과세 선택 가능 → 개별 상담 필요"

  chatbot_usage:
    key_message: "납입 시 16.5% 공제받고 수령 시 3.3~5.5%만 낸다 = 세율 차이만큼의 절세 효과"
    caution: "'세금이 없다'는 표현 금지. 저율 과세이지 비과세가 아님."

# ------------------------------------------------------------
# 3. 세제적격 — 중도 해지 / 연금 외 수령
# ------------------------------------------------------------
early_withdrawal_penalty:

  - id: TAX-EW-001
    name: 기타소득세_중도해지
    value: 16.5
    unit: percent
    taxation_type: 분리과세
    description: >
      중도 해지하거나 연금 외의 형태로 수령(연금수령한도 초과 인출 포함)하는 경우,
      세액공제를 받은 납입 원금과 운용수익에 대해 기타소득세 16.5%가 부과된다.
    severity: HIGH
    disclosure_required: true    # ← 상품 권유 시 반드시 고지
    chatbot_note: >
      ⭐ 이 항목은 '단점 먼저 말하기' 원칙의 핵심이다.
      세액공제 혜택을 안내한 직후 반드시 함께 안내해야 한다.
      공제받은 16.5%를 해지 시 16.5%로 다시 토해내는 구조이므로,
      단기 자금으로 접근하는 고객에게는 오히려 권하지 않는 것이 맞다.

  exceptions:
    description: "부득이한 사유에 해당하면 저율(연금소득세율) 분리과세 적용 가능"
    cases:
      - 가입자의 사망 또는 해외이주
      - 가입자 또는 부양가족의 3개월 이상 요양
      - 가입자의 파산 또는 개인회생절차 개시
      - 천재지변
      - 금융회사의 영업정지·인가취소·해산·파산
    note: "요건·증빙은 개별 확인 필요 → 챗봇은 '해당될 수 있으니 상담 확인' 수준으로만 안내"

# ------------------------------------------------------------
# 4. 세제비적격 (일반 연금보험) — 보험차익 비과세
# ------------------------------------------------------------
tax_free_insurance:

  - id: TAX-TF-001
    name: 월적립식_비과세_요건
    conditions:
      납입기간_최소: "5년 이상"
      유지기간_최소: "10년 이상"
      월납입한도: 1500000
      한도_산정방식: "기본보험료 + 추가납입보험료 합산 기준, 월별 150만 원 이하"
    description: "요건 충족 시 보험차익(이자소득)에 대해 비과세"
    caution: "세액공제는 없음. 납입 단계 혜택과 수령 단계 혜택을 혼동시키지 말 것."

  - id: TAX-TF-002
    name: 일시납_비과세_요건
    conditions:
      유지기간_최소: "10년 이상"
      납입한도: 100000000
    description: "일시납 1억 원 이하 + 10년 이상 유지 시 보험차익 비과세"
    caution: >
      ⚠️ 여러 건의 일시납 계약 보험료 합계가 1억 원을 초과하면
      초과분만이 아니라 전체 계약이 과세 대상이 될 수 있음. 반드시 고지.

  - id: TAX-TF-003
    name: 비과세_요건_미충족시_과세
    value: 15.4
    unit: percent
    description: "10년 이내 해지 등 요건 미충족 시 보험차익에 이자소득세 부과"
    disclosure_required: true

  chatbot_usage:
    key_message: "비과세는 '세금 감면'이지 '수익 보장'이 아니다."
    forbidden_framing:
      - "10년만 두면 무조건 비과세"      # ❌ 요건 미충족 시 과세됨
      - "세금 한 푼도 안 냅니다"          # ❌ 단정
    allowed_framing:
      - "요건을 충족하면 보험차익에 대해 비과세 혜택을 받을 수 있습니다"
      - "다만 10년 이내 해지 시에는 이자소득세가 부과될 수 있습니다"

# ------------------------------------------------------------
# 5. 세제적격 vs 세제비적격 비교 (챗봇 응답용 정리)
# ------------------------------------------------------------
comparison:
  headers: ["구분", "연금저축보험 (세제적격)", "연금보험 (세제비적격)"]
  rows:
    - ["납입 단계", "세액공제 (연 600만 원 한도, 13.2~16.5%)", "세제 혜택 없음"]
    - ["수령 단계", "연금소득세 3.3~5.5% 과세", "요건 충족 시 보험차익 비과세"]
    - ["수령 개시", "만 55세 이후", "상품별 상이 (조기 개시 선택폭 넓음)"]
    - ["중도 해지", "기타소득세 16.5% (부담 큼)", "10년 이내 시 이자소득세 15.4%"]
    - ["납입 한도", "세액공제 한도 존재", "비과세 한도 존재 (월 150만/일시납 1억)"]
    - ["적합 고객", "연말정산 환급이 필요한 근로소득자", "고액 자산가, 비과세·종신 수령 니즈"]

  chatbot_note: >
    ⚠️ 두 상품은 우열 관계가 아니라 목적이 다른 상품이다.
    "A가 B보다 좋다"는 식으로 안내하지 말고, 고객의 소득 형태·자금 목적에 따라 갈린다고 설명할 것.
    소득이 없는 전업주부는 세액공제 효과가 없으므로 A를 권하면 부적합 판매가 된다. (적합성 원칙 위반)

# ------------------------------------------------------------
# 6. 챗봇 안내 시 필수 부기 사항
# ------------------------------------------------------------
mandatory_notes:
  - "세액공제율·한도는 소득 구간 및 세법 개정에 따라 달라질 수 있습니다."
  - "실제 환급액은 개인의 결정세액 범위 내에서 결정되므로, 납부할 세금이 적으면 환급액이 줄어들 수 있습니다."
  - "정확한 세액은 연말정산 시 확정되며, 본 안내는 참고용 계산입니다."
  - "기존 연금저축·IRP 가입 여부에 따라 합산 한도가 달라지므로 반드시 보유 계좌를 확인하세요."

