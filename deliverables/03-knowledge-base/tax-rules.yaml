    desc: "연금계좌 세액공제 관련 소득세법 제59조의3"
  - org: 찾기쉬운 생활법령정보 (법제처)
    url: "https://easylaw.go.kr/CSP/CnpClsMain.laf?popMenu=ov&csmSeq=2056&ccfNo=3&cciNo=2&cnpClsNo=1"
    desc: "개인연금제도 - 연금저축"
  - org: 소득세법 시행령
    desc: "제25조 (저축성보험의 보험차익 비과세 요건)"
